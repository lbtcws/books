server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # vite base 为 /books/：
    # - /books/books/**  -> 挂载的书籍文件（docker-compose volume）
    # - 其余 /books/**    -> dist 静态资源，SPA 回退 index.html
    location /books/books/ {
        alias /usr/share/nginx/html/books/;
    }

    location /books/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location / {
        return 302 /books/;
    }
}
