server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # vite base 为 /books/：静态资源与路由都挂在 /books/ 下
    location /books/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location / {
        return 302 /books/;
    }
}
