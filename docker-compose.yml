name: lbtc-ai-knowledge-library

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_AI_API: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - path: backend/.env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      POSTGRES_DSN: postgresql+psycopg://lbtc:lbtc@postgres:5432/lbtc
    volumes:
      - ./library:/data/library:ro
      - backend_uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lbtc
      POSTGRES_PASSWORD: lbtc
      POSTGRES_DB: lbtc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lbtc"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
  backend_uploads:
