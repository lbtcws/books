<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>码外人生 | feZsy's Digital Library</title>
    <meta name="description" content="个人数字图书馆 - 投资理财、认知成长精选书籍">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Local CSS -->
    <link rel="stylesheet" href="./lib/github-markdown.min.css">
    <script src="./lib/marked.min.js"></script>

    <style>
        :root {
            /* Color Palette - Modern Gradient Theme */
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --accent: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            
            /* Backgrounds */
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --bg-card: rgba(30, 41, 59, 0.8);
            
            /* Text */
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            
            /* Borders & Shadows */
            --border-color: rgba(148, 163, 184, 0.1);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --glow: 0 0 20px rgba(99, 102, 241, 0.3);
            
            /* Layout */
            --sidebar-width: 300px;
            --header-height: 70px;
            
            /* Transitions */
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 15s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-icon {
            font-size: 2rem;
        }

        .header-stats {
            display: flex;
            gap: 30px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-light);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Main Layout */
        .app-container {
            display: flex;
            margin-top: var(--header-height);
            min-height: calc(100vh - var(--header-height));
            position: relative;
            z-index: 1;
        }

        /* Sidebar */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: margin-left var(--transition-normal);
            flex-shrink: 0;
            position: relative;
        }

        body.collapsed #sidebar {
            margin-left: calc(var(--sidebar-width) * -1);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: var(--transition-fast);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--glow);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        #module-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        #module-container::-webkit-scrollbar {
            width: 6px;
        }

        #module-container::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 3px;
        }

        #module-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        .category-section {
            margin-bottom: 24px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition-fast);
            margin-bottom: 12px;
        }

        .category-header:hover {
            background: var(--bg-card);
            transform: translateX(4px);
        }

        .category-icon {
            font-size: 1.2rem;
        }

        .category-title {
            flex: 1;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .category-count {
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .category-arrow {
            transition: var(--transition-fast);
            color: var(--text-muted);
        }

        .category-header.open .category-arrow {
            transform: rotate(90deg);
        }

        .book-list {
            list-style: none;
            padding-left: 12px;
            display: none;
        }

        .book-list.open {
            display: block;
            animation: slideDown var(--transition-normal);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .book-item {
            padding: 10px 16px;
            margin: 4px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-fast);
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .book-item:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-light);
            transform: translateX(4px);
        }

        .book-item.active {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary-light);
            border-left: 3px solid var(--primary);
        }

        .book-icon {
            font-size: 1rem;
        }

        /* Main Content */
        #main-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: transparent;
            position: relative;
            overflow: hidden;
        }

        /* Toggle Button */
        #toggle-btn {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 100;
            width: 48px;
            height: 48px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-lg), var(--glow);
            transition: var(--transition-fast);
            color: white;
        }

        #toggle-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-xl), 0 0 30px rgba(99, 102, 241, 0.5);
        }

        body.collapsed #toggle-btn svg {
            transform: rotate(180deg);
        }

        /* Info Panel */
        #info-panel {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 24px 40px;
            display: none;
            position: relative;
            animation: slideDown var(--transition-normal);
        }

        .panel-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
        }

        .panel-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .close-panel-btn {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-fast);
            font-size: 0.85rem;
        }

        .close-panel-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .summary-content {
            color: var(--text-secondary);
            line-height: 1.8;
            font-size: 0.95rem;
            padding-left: 20px;
            border-left: 4px solid var(--primary);
            white-space: pre-wrap;
        }

        /* Content Area */
        #render-container {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 30px;
        }

        /* Welcome Screen */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 20px;
        }

        .welcome-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .welcome-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 500px;
            line-height: 1.6;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .feature-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            transition: var(--transition-fast);
        }

        .feature-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: var(--glow);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .feature-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .feature-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* PDF Viewer */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            background: var(--bg-secondary);
            display: none;
        }

        /* Markdown Content */
        #md-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            display: none;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 40px;
        }

        #md-wrapper::-webkit-scrollbar {
            width: 8px;
        }

        #md-wrapper::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        #md-wrapper::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        .markdown-body {
            max-width: 900px;
            margin: 0 auto;
            font-size: 16px;
            line-height: 1.8;
        }

        .markdown-body {
            background: transparent !important;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            color: var(--text-primary);
            border-bottom-color: var(--border-color);
        }

        .markdown-body p,
        .markdown-body li {
            color: var(--text-secondary);
        }

        .markdown-body a {
            color: var(--primary-light);
        }

        .markdown-body code {
            background: var(--bg-tertiary);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .markdown-body pre {
            background: var(--bg-tertiary) !important;
            border-radius: 8px;
        }

        /* Download Card */
        #download-card {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 20px;
        }

        .download-icon {
            font-size: 5rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .download-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .download-desc {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 32px;
            background: var(--accent-gradient);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: var(--transition-fast);
            box-shadow: var(--shadow-md);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg), var(--glow);
        }

        /* Floating Action Button */
        #floating-action-trigger {
            position: absolute;
            right: 30px;
            bottom: 30px;
            z-index: 90;
            width: 56px;
            height: 56px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-lg), var(--glow);
            transition: var(--transition-fast);
            font-size: 1.5rem;
        }

        #floating-action-trigger:hover {
            transform: scale(1.1);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            :root {
                --sidebar-width: 280px;
            }
            
            .feature-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            :root {
                --sidebar-width: 260px;
            }
            
            header {
                padding: 0 20px;
            }
            
            .header-stats {
                display: none;
            }
            
            .welcome-title {
                font-size: 1.8rem;
            }
            
            .feature-grid {
                grid-template-columns: 1fr;
            }
            
            #render-container {
                padding: 20px;
            }
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--bg-tertiary);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <span class="logo-icon">📚</span>
            <span>码外人生</span>
        </div>
        <div class="header-stats">
            <div class="stat-item">
                <span class="stat-value" id="total-books">0</span>
                <span class="stat-label">藏书</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="total-categories">0</span>
                <span class="stat-label">分类</span>
            </div>
        </div>
    </header>

    <!-- Main App -->
    <div class="app-container">
        <!-- Sidebar -->
        <div id="sidebar">
            <div class="sidebar-header">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="search-input" placeholder="搜索书籍...">
                </div>
            </div>
            <div id="module-container"></div>
        </div>

        <!-- Toggle Button -->
        <button id="toggle-btn" onclick="toggleSidebar()" data-tooltip="收起菜单">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </button>

        <!-- Main Viewport -->
        <div id="main-viewport">
            <!-- Info Panel -->
            <div id="info-panel">
                <div class="panel-header">
                    <h2 id="item-title" class="panel-title"></h2>
                    <button class="close-panel-btn" onclick="setPanelVisible(false)">关闭</button>
                </div>
                <div class="summary-content" id="item-summary"></div>
            </div>

            <!-- Content Area -->
            <div id="render-container">
                <!-- Welcome Screen -->
                <div class="welcome-screen" id="welcome-msg">
                    <div class="welcome-icon">📖</div>
                    <h1 class="welcome-title">欢迎来到数字图书馆</h1>
                    <p class="welcome-subtitle">精选投资理财、认知成长类书籍，助力你的财富与思维双重升级</p>
                    <div class="feature-grid">
                        <div class="feature-card">
                            <div class="feature-icon">📊</div>
                            <div class="feature-title">投资理财</div>
                            <div class="feature-desc">巴菲特、芒格等大师经典</div>
                        </div>
                        <div class="feature-card">
                            <div class="feature-icon">🧠</div>
                            <div class="feature-title">认知成长</div>
                            <div class="feature-desc">思维模型与决策智慧</div>
                        </div>
                        <div class="feature-card">
                            <div class="feature-icon">📈</div>
                            <div class="feature-title">财经经典</div>
                            <div class="feature-desc">经济学与商业洞察</div>
                        </div>
                    </div>
                </div>

                <!-- PDF Viewer -->
                <iframe id="pdf-viewer"></iframe>

                <!-- Markdown Viewer -->
                <div id="md-wrapper">
                    <div id="md-content" class="markdown-body"></div>
                </div>

                <!-- Download Card -->
                <div id="download-card">
                    <div class="download-icon">📥</div>
                    <h3 class="download-title" id="download-title"></h3>
                    <p class="download-desc">EPUB 格式建议下载后阅读</p>
                    <a href="#" id="actual-download-link" class="download-btn">
                        <span>⬇️</span>
                        <span>立即下载</span>
                    </a>
                </div>

                <!-- Floating Action Button -->
                <div id="floating-action-trigger" onclick="setPanelVisible(true)" data-tooltip="查看详情">💡</div>
            </div>
        </div>
    </div>

    <script>
        // State
        let allBooks = [];
        let totalBooks = 0;

        // Toggle Sidebar
        function toggleSidebar() {
            const isCollapsed = document.body.classList.toggle('collapsed');
            const btn = document.getElementById('toggle-btn');
            btn.setAttribute('data-tooltip', isCollapsed ? '展开菜单' : '收起菜单');
        }

        // Panel Visibility
        function setPanelVisible(visible) {
            const panel = document.getElementById('info-panel');
            const trigger = document.getElementById('floating-action-trigger');
            if (visible) {
                panel.style.display = 'block';
                trigger.style.display = 'none';
            } else {
                panel.style.display = 'none';
                if (document.getElementById('welcome-msg').style.display === 'none') {
                    trigger.style.display = 'flex';
                }
            }
        }

        // Search Functionality
        function setupSearch() {
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                filterBooks(query);
            });
        }

        function filterBooks(query) {
            const bookItems = document.querySelectorAll('.book-item');
            bookItems.forEach(item => {
                const title = item.textContent.toLowerCase();
                if (query === '' || title.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Render Book Tree
        function renderBookTree(data) {
            const container = document.getElementById('module-container');
            const categoryCount = Object.keys(data).length;
            
            // Count total books
            totalBooks = 0;
            allBooks = [];
            for (let category in data) {
                totalBooks += data[category].length;
                data[category].forEach(book => {
                    allBooks.push({ ...book, category });
                });
            }

            // Update stats
            document.getElementById('total-books').textContent = totalBooks;
            document.getElementById('total-categories').textContent = categoryCount;

            // Category icons
            const categoryIcons = {
                '巴菲特信': '📈',
                '财经': '💰',
                '认知': '🧠'
            };

            let html = '';
            for (let category in data) {
                const icon = categoryIcons[category] || '📚';
                const count = data[category].length;
                
                html += `
                    <div class="category-section">
                        <div class="category-header open" onclick="toggleCategory(this)">
                            <span class="category-icon">${icon}</span>
                            <span class="category-title">${category}</span>
                            <span class="category-count">${count}</span>
                            <span class="category-arrow">▶</span>
                        </div>
                        <ul class="book-list open">
                            ${data[category].map((book, index) => `
                                <li class="book-item" data-category="${category}" data-index="${index}">
                                    <span class="book-icon">📄</span>
                                    <span>${book.title}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }
            
            container.innerHTML = html;

            // Add click listeners
            document.querySelectorAll('.book-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const category = item.dataset.category;
                    const index = parseInt(item.dataset.index);
                    
                    // Update active state
                    document.querySelectorAll('.book-item').forEach(b => b.classList.remove('active'));
                    item.classList.add('active');
                    
                    // Render item
                    renderItem(category, data[category][index]);
                    
                    // Auto-collapse on mobile
                    if (window.innerWidth < 768 && !document.body.classList.contains('collapsed')) {
                        toggleSidebar();
                    }
                });
            });
        }

        function toggleCategory(header) {
            header.classList.toggle('open');
            const list = header.nextElementSibling;
            list.classList.toggle('open');
        }

        // Render Item
        function renderItem(category, item) {
            document.getElementById('welcome-msg').style.display = 'none';

            // Update panel
            document.getElementById('item-title').textContent = item.title;
            document.getElementById('item-summary').textContent = item.summary;
            setPanelVisible(true);

            // Hide all viewers
            const pdf = document.getElementById('pdf-viewer');
            const mdWrap = document.getElementById('md-wrapper');
            const dl = document.getElementById('download-card');
            [pdf, mdWrap, dl].forEach(el => el.style.display = 'none');

            const url = `./books/${encodeURIComponent(category)}/${encodeURIComponent(item.fileName)}`;

            if (item.fileName.toLowerCase().endsWith('.md')) {
                mdWrap.style.display = 'block';
                document.getElementById('md-content').innerHTML = '<div style="text-align:center;padding:40px;"><span class="loading"></span></div>';
                fetch(url)
                    .then(r => r.text())
                    .then(text => {
                        if (window.marked) {
                            document.getElementById('md-content').innerHTML = marked.parse(text);
                        } else {
                            document.getElementById('md-content').innerHTML = '<pre>' + text + '</pre>';
                        }
                        mdWrap.scrollTop = 0;
                    })
                    .catch(err => {
                        document.getElementById('md-content').innerHTML = '<p style="color:red;">加载失败</p>';
                    });
            } else if (item.fileName.toLowerCase().endsWith('.epub')) {
                dl.style.display = 'flex';
                document.getElementById('download-title').textContent = item.title;
                document.getElementById('actual-download-link').href = url;
            } else {
                pdf.style.display = 'block';
                pdf.src = url;
            }
        }

        // Initialize
        fetch('./books_data.json')
            .then(res => res.json())
            .then(data => {
                renderBookTree(data);
                setupSearch();
            })
            .catch(err => {
                console.error('Failed to load books data:', err);
                document.getElementById('module-container').innerHTML = 
                    '<p style="color:var(--text-muted);text-align:center;padding:20px;">加载失败，请刷新页面重试</p>';
            });
    </script>
</body>

</html>
