<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>pdf.js CDN render test</title>
</head>
<body>
  <canvas id="c" width="800" height="1000" style="border:1px solid #ccc"></canvas>
  <pre id="log" style="white-space:pre-wrap"></pre>
  <script type="module">
    import * as pdfjsLib from 'https://unpkg.com/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs'
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://unpkg.com/pdfjs-dist@4.10.38/legacy/build/pdf.worker.min.mjs'
    const log = (m) => { document.getElementById('log').textContent += m + '\n' }
    try {
      const res = await fetch('./books/%E4%B9%8C%E5%90%88%E4%B9%8B%E4%BC%97%EF%BC%9A%E5%A4%A7%E4%BC%97%E5%BF%83%E7%90%86%E7%A0%94%E7%A9%B6.pdf')
      const buf = await res.arrayBuffer()
      log('fetched bytes: ' + buf.byteLength)
      const doc = await pdfjsLib
        .getDocument({ data: buf, cMapUrl: './cmaps/', cMapPacked: true })
        .promise
      log('pages: ' + doc.numPages)
      const page = await doc.getPage(1)
      const viewport = page.getViewport({ scale: 1.2 })
      const canvas = document.getElementById('c')
      canvas.width = viewport.width
      canvas.height = viewport.height
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise
      log('RENDER OK, viewport: ' + Math.round(viewport.width) + 'x' + Math.round(viewport.height))
    } catch (e) {
      log('ERROR: ' + e.name + ': ' + e.message)
      log((e.stack || '').split('\n').slice(0, 5).join('\n'))
    }
  </script>
</body>
</html>
