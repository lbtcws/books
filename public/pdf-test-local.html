<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>pdf.js same-origin worker test</title>
</head>
<body>
  <canvas id="c" width="800" height="1000" style="border:1px solid #ccc"></canvas>
  <pre id="log" style="white-space:pre-wrap"></pre>
  <script type="module">
    const pdfjsLib = await import('./pdfjs/pdf.min.mjs?v=4.10.38')
    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.min.mjs?v=4.10.38'
    const log = (m) => { document.getElementById('log').textContent += m + '\n' }
    log('workerSrc: ' + pdfjsLib.GlobalWorkerOptions.workerSrc)
    // 诊断：同源 module worker 是否可创建
    try {
      const w = new Worker('./pdfjs/pdf.worker.min.mjs?v=4.10.38', { type: 'module' })
      log('new Worker(module): OK')
      w.terminate()
    } catch (e) {
      log('new Worker(module) THREW: ' + e.message)
    }
    try {
      const res = await fetch('./books/%E4%B9%8C%E5%90%88%E4%B9%8B%E4%BC%97%EF%BC%9A%E5%A4%A7%E4%BC%97%E5%BF%83%E7%90%86%E7%A0%94%E7%A9%B6.pdf')
      const buf = await res.arrayBuffer()
      log('fetched bytes: ' + buf.byteLength)
      const task = pdfjsLib.getDocument({ data: buf, cMapUrl: './cmaps/', cMapPacked: true })
      const doc = await task.promise
      log('pages: ' + doc.numPages)
      log('worker: ' + (task.worker ? 'created' : 'none'))
      const page = await doc.getPage(1)
      const dpr = window.devicePixelRatio || 1
      const viewport = page.getViewport({ scale: 1.2 })
      const canvas = document.getElementById('c')
      canvas.width = Math.floor(viewport.width * dpr)
      canvas.height = Math.floor(viewport.height * dpr)
      canvas.style.width = Math.floor(viewport.width) + 'px'
      canvas.style.height = Math.floor(viewport.height) + 'px'
      await page
        .render({
          canvasContext: canvas.getContext('2d'),
          viewport,
          transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null,
        })
        .promise
      log('RENDER OK, dpr=' + dpr + ', canvas=' + canvas.width + 'x' + canvas.height)
    } catch (e) {
      log('ERROR: ' + e.name + ': ' + e.message)
      log((e.stack || '').split('\n').slice(0, 8).join('\n'))
    }
  </script>
</body>
</html>
